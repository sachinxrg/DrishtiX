[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "drishtix"
version = "4.0.0"
description = "Real-time tactical facial recognition system for edge deployment"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DrishtiX Team"}
]

dependencies = [
    "PySide6>=6.5.0",
    "opencv-python-headless>=4.9.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "structlog>=23.0.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
