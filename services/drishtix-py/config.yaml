# DrishtiX v4.0 Runtime Configuration
app:
  name: "DrishtiX v4.0"
  log_level: "INFO"

camera:
  source: 0
  resolution: [1280, 720]
  target_fps: 30

detection:
  model_path: "models/face_detection_yunet_2023mar.onnx"
  score_threshold: 0.65
  nms_threshold: 0.3
  inference_interval: 1

recognition:
  engine: "sface"
  model_pack: "buffalo_s"
  model_path: "models/face_recognition_sface_2021dec.onnx"
  match_threshold: 0.58
  pool_size: 4

alerts:
  cooldown_seconds: 30
  max_queue_size: 50
  sound_enabled: true
  telegram_enabled: false
  telegram_bot_token: ""
  telegram_chat_id: ""

database:
  path: "data/drishtix.db"

tracking:
  algorithm: "KCF"
  max_stale_frames: 10
